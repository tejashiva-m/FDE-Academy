name: FastAPI CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r week03/day19/requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall week03/day19

      - name: Run tests
        working-directory: week03/day19
        run: pytest